# ==============================================================================
# CONTOH KONFIGURASI RCLONE (rclone.conf)
# Letakkan konfigurasi remote Rclone Anda di file bernama "rclone.conf"
# di root folder bot ini jika menggunakan /mirror ke cloud storage.
# ==============================================================================

# [Contoh Remote Google Drive]
# [gdrive]
# type = drive
# client_id = 
# client_secret = 
# scope = drive
# token = {"access_token":"...","token_type":"Bearer","refresh_token":"...","expiry":"..."}
# team_drive = 

# [Contoh Remote Mega]
# [mega]
# type = mega
# user = emailanda@gmail.com
# pass = passwordterenkripsi
